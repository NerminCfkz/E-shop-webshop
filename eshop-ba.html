<!DOCTYPE html>
<html lang="bs" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Shop.ba</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#FADBDA;
    --bg:#7A1C24;
    --on-bg:#FFF1EF;
    --on-bg-soft:rgba(255,241,239,.78);
    --panel:#FFFFFF;
    --ink:#171321;
    --line:#E7C9C7;
    --indigo:#4B3AFF;
    --indigo-deep:#2E22B8;
    --lime:#D4FF3D;
    --lime-deep:#A8CC1F;
    --muted:#6E6A7A;
    --good:#0F8F52;
    --r-lg:28px;
    --r-md:18px;
    --r-sm:10px;
    --display: "Space Grotesk", sans-serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0);
    background-size:22px 22px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  header{position:sticky;top:0;z-index:30;background:var(--bg);padding:18px 24px 10px;}
  .header-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:flex-start;gap:16px;max-width:1240px;margin:0 auto;}
  .header-spacer{min-width:0;}
  .logo{color:var(--on-bg);font-family:var(--display);font-size:21px;font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:8px;}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--indigo);display:inline-block;}
  .search-wrap{width:100%;max-width:504px;justify-self:center;display:flex;flex-direction:column;align-items:center;min-width:0;}
  .pill-search{width:100%;display:flex;align-items:center;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:4px 4px 4px 18px;min-width:0;}
  .pill-search select{border:none;background:transparent;font-size:13px;color:var(--muted);padding-right:10px;border-right:1px solid var(--line);font-family:var(--sans);flex-shrink:0;max-width:92px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pill-search input{flex:1;min-width:0;border:none;background:transparent;padding:9px 12px;font-size:14px;outline:none;}
  #search-btn{background:var(--ink);color:var(--paper);border:none;padding:9px 28px;border-radius:999px;font-weight:600;font-size:13px;flex-shrink:0;}
  .search-actions-row{display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:30px;}
  #cart-btn{display:flex;align-items:center;gap:8px;background:var(--indigo);border:none;color:#fff;font-size:13.5px;font-weight:600;padding:9px 18px 9px 16px;border-radius:999px;position:relative;flex-shrink:0;}
  .header-actions{display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:13px;margin-top:8px;justify-self:end;}
  .header-actions .stack{display:flex;flex-direction:column;line-height:1.2;cursor:pointer;background:#E3A6A2;border:2px solid var(--ink);border-radius:14px;padding:6px 14px;}
  .header-actions .stack:hover{background:#DC948F;}
  .header-actions .stack small{opacity:.65;font-size:11px;}
  .header-actions .stack b{font-size:13px;font-weight:600;}
  #cart-count{background:var(--lime);color:var(--ink);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

  .lang-bar{background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;}
  .lang-switch{display:flex;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:3px;gap:2px;flex-shrink:0;}
  .lang-switch button{background:transparent;border:none;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.02em;}
  .lang-switch button.active{background:var(--ink);color:var(--paper);}

  nav.cats{max-width:1240px;margin:14px auto 0;padding:0 24px;}
  .cats-dropdown{background:var(--panel);border:2px solid var(--ink);color:var(--ink);font-size:13.5px;font-weight:600;font-family:var(--sans);padding:10px 16px;border-radius:999px;cursor:pointer;outline:none;}
  .cats-dropdown:hover{border-color:var(--indigo);}

  .bento{max-width:1240px;margin:22px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:100px;gap:14px;}
  .bento > div{border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;}
  .bento .b-hero{grid-column:span 4;grid-row:span 3;background:var(--indigo);color:#fff;justify-content:space-between;flex-direction:row;align-items:flex-end;animation-delay:.02s;}
  .bento .b-hero h1{font-family:var(--display);font-size:32px;line-height:1.1;font-weight:700;margin:0;max-width:22ch;}
  .bento .b-hero a{background:var(--lime);color:var(--ink);padding:12px 20px;border-radius:999px;font-weight:700;font-size:13.5px;flex-shrink:0;}
  .bento .b-side{grid-column:span 2;grid-row:span 1;background:var(--panel);border:2px solid var(--ink);cursor:pointer;animation-delay:.08s;}
  .bento .b-side:nth-of-type(3){animation-delay:.14s;}
  .bento .b-side h3{font-family:var(--display);font-size:15px;margin:0;font-weight:600;}
  .bento .b-side .ico{font-size:26px;margin-bottom:auto;}
  .bento .b-stat{grid-column:span 2;grid-row:span 2;background:var(--lime);animation-delay:.2s;}
  .bento .b-stat .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;}
  .bento .b-stat p{font-size:13px;margin:6px 0 0;font-weight:600;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  main{max-width:1240px;margin:0 auto;padding:40px 24px 70px;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
  .section-head h2{font-family:var(--display);font-size:26px;font-weight:700;margin:0;color:var(--on-bg);}
  .section-head span{font-size:12.5px;color:var(--on-bg-soft);font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;transition:border-color .15s, transform .15s;}
  .card:hover{border-color:var(--ink);transform:translateY(-3px);}
  .card .thumb{width:100%;height:118px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:12px;overflow:hidden;position:relative;}
  .card .thumb .icon-anim{display:inline-block;animation:float 3.2s ease-in-out infinite;}
  .card:hover .thumb .icon-anim{animation:spin-pop .6s ease-in-out;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-8px) rotate(-4deg);}}
  @keyframes spin-pop{0%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.25) rotate(8deg);}100%{transform:scale(1) rotate(0deg);}}
  .card .cat-tag{font-size:11px;color:var(--indigo);font-weight:700;margin-bottom:5px;}
  .card h3{font-size:14.5px;margin:0 0 8px;font-weight:600;line-height:1.3;min-height:38px;}
  .stars{color:var(--lime-deep);font-size:12.5px;margin-bottom:8px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;}
  .stars:hover{text-decoration:underline;}
  .stars small{color:var(--muted);margin-left:4px;font-weight:600;}
  .price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;}
  .price{font-family:var(--display);font-size:19px;font-weight:700;}
  .price-strike{font-size:12.5px;color:var(--muted);text-decoration:line-through;}
  .add-btn{margin-top:auto;background:var(--ink);border:2px solid var(--ink);padding:10px;border-radius:999px;font-weight:700;font-size:13px;color:var(--paper);}
  .add-btn:hover{background:var(--indigo);border-color:var(--indigo);}
  .add-btn.added{background:var(--good);border-color:var(--good);color:#fff;}

  .overlay{position:fixed;inset:0;background:rgba(23,19,33,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:12px;right:12px;bottom:12px;width:380px;max-width:92vw;background:var(--panel);z-index:41;border-radius:var(--r-lg);transform:translateX(calc(100% + 20px));transition:transform .25s ease;display:flex;flex-direction:column;overflow:hidden;border:2px solid var(--ink);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px 22px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h2{font-family:var(--display);font-size:20px;margin:0;}
  .drawer-head button{background:var(--paper);border:none;font-size:16px;color:var(--ink);width:30px;height:30px;border-radius:50%;}
  .drawer-items{flex:1;overflow-y:auto;padding:14px 22px;}
  .drawer-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .drawer-item .thumb-sm{width:52px;height:52px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;}
  .drawer-item .thumb-sm .icon-anim{display:inline-block;animation:float 3.2s ease-in-out infinite;}
  .drawer-item .info{flex:1;}
  .drawer-item .info h4{font-size:13.5px;margin:0 0 6px;font-weight:600;}
  .qty-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .qty-row button{background:var(--paper);border:2px solid var(--line);width:24px;height:24px;border-radius:50%;font-size:14px;line-height:1;}
  .drawer-item .remove{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600;}
  .drawer-item .remove:hover{color:#C93A2E;}
  .drawer-foot{padding:18px 22px;border-top:2px solid var(--line);}
  .subtotal-row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:12px;font-weight:600;}
  .subtotal-row b{font-family:var(--display);font-size:19px;}
  .checkout-btn{width:100%;background:var(--indigo);color:#fff;border:none;padding:14px;border-radius:999px;font-weight:700;font-size:14.5px;}
  .checkout-btn:disabled{opacity:.35;}
  .empty-cart{text-align:center;color:var(--muted);font-size:13.5px;padding:60px 20px;font-weight:500;}

  .modal-overlay{overflow-y:auto;position:fixed;inset:0;background:rgba(23,19,33,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.open{display:flex;}

  .auth-modal{max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border-radius:var(--r-lg);max-width:400px;width:100%;padding:28px 26px;border:2px solid var(--ink);}
  .auth-tabs{display:flex;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px;gap:2px;margin-bottom:22px;}
  .auth-tabs button{flex:1;background:transparent;border:none;padding:9px 0;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink);}
  .auth-tabs button.active{background:var(--ink);color:var(--paper);}
  .auth-form{display:none;flex-direction:column;gap:12px;}
  .auth-form.active{display:flex;}
  .auth-form input{border:2px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;font-family:var(--sans);outline:none;background:var(--paper);}
  .auth-form input:focus{border-color:var(--indigo);}
  .auth-form button.auth-submit{background:var(--indigo);color:#fff;border:none;padding:12px;border-radius:999px;font-weight:700;font-size:14px;margin-top:4px;}
  .auth-error{display:none;color:#C93A2E;font-size:12.5px;font-weight:600;text-align:center;margin:0;}
  .auth-switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px;}
  .auth-switch a{color:var(--indigo);font-weight:700;cursor:pointer;}
  .auth-title{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 4px;text-align:center;}
  .auth-sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px;}
  .auth-success{display:none;text-align:center;}
  .auth-success.active{display:block;}
  .auth-success .check{width:52px;height:52px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;font-weight:800;}
  .admin-badge{display:inline-block;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.03em;padding:4px 10px;border-radius:999px;margin-bottom:14px;}
  .ap-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;}
  .ap-divider{height:2px;background:var(--line);margin:20px 0 16px;border-radius:2px;}
  .ap-item-name{font-weight:600;}
  .ap-item-remove{background:none;border:none;color:#C93A2E;font-weight:700;font-size:12px;cursor:pointer;}
  #ap-list{margin-top:14px;max-height:160px;overflow-y:auto;}
  .auth-close-x{position:absolute;top:14px;right:14px;background:var(--paper);border:none;width:28px;height:28px;border-radius:50%;font-size:14px;}
  .auth-body{position:relative;}
  .modal{background:var(--panel);border-radius:var(--r-lg);max-width:420px;width:100%;padding:34px 30px;text-align:center;border:2px solid var(--ink);}
  .modal .check{width:56px;height:56px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;font-weight:800;}
  .modal h2{font-family:var(--display);font-size:22px;margin:0 0 8px;font-weight:700;}
  .modal p{color:var(--muted);font-size:14px;margin:0 0 22px;}
  .modal button{background:var(--ink);color:var(--paper);border:none;padding:12px 26px;border-radius:999px;font-weight:700;font-size:14px;}

  footer{color:var(--on-bg-soft);font-size:12.5px;text-align:center;padding:30px;}

  /* ===== Chat widget ===== */
  .chat-fab{position:fixed;bottom:20px;left:20px;z-index:45;background:var(--indigo);color:#fff;border:2px solid var(--ink);width:58px;height:58px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(23,19,33,.25);}
  .chat-fab:hover{background:var(--indigo-deep);}
  .chat-panel{position:fixed;bottom:90px;left:20px;width:340px;max-width:90vw;height:460px;max-height:70vh;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r-lg);z-index:46;display:flex;flex-direction:column;overflow:hidden;transform:scale(.9) translateY(10px);opacity:0;pointer-events:none;transition:all .18s ease;transform-origin:bottom left;}
  .chat-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:auto;}
  .chat-head{background:var(--indigo);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
  .chat-head .info h3{font-family:var(--display);font-size:15px;margin:0;font-weight:700;}
  .chat-head .info p{margin:2px 0 0;font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px;}
  .chat-head .info p .dot-live{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block;}
  .chat-head button{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
  .chat-bubble{max-width:80%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;}
  .chat-bubble.bot{background:var(--panel);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .chat-bubble.user{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px;}
  .chat-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:var(--paper);}
  .chat-quick button{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--ink);}
  .chat-quick button:hover{border-color:var(--indigo);}
  .chat-input-row{display:flex;gap:8px;padding:12px;border-top:2px solid var(--line);background:var(--panel);}
  .chat-input-row input{flex:1;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;outline:none;font-family:var(--sans);}
  .chat-input-row input:focus{border-color:var(--indigo);}
  .chat-input-row button{background:var(--indigo);color:#fff;border:none;width:38px;height:38px;border-radius:50%;font-size:15px;flex-shrink:0;}
  .chat-typing{align-self:flex-start;display:flex;gap:4px;padding:10px 13px;background:var(--panel);border:2px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;}
  .chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing-bounce 1s infinite ease-in-out;}
  .chat-typing span:nth-child(2){animation-delay:.15s;}
  .chat-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes typing-bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
  @media(max-width:480px){
    .chat-panel{left:10px;width:calc(100vw - 20px);bottom:82px;}
    .chat-fab{left:14px;bottom:14px;}
  }

  /* ===== Reviews modal ===== */
  .review-modal{background:var(--panel);border-radius:var(--r-lg);max-width:460px;width:100%;padding:0;border:2px solid var(--ink);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
  .review-head{padding:20px 22px 16px;border-bottom:2px solid var(--line);}
  .review-head h2{font-family:var(--display);font-size:19px;margin:0 0 6px;font-weight:700;}
  .review-summary{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .review-summary .avg-stars{color:var(--lime-deep);font-size:15px;}
  .review-close{position:absolute;top:14px;right:14px;background:var(--paper);border:none;width:28px;height:28px;border-radius:50%;font-size:14px;}
  .review-list{overflow-y:auto;padding:14px 22px;flex:1;display:flex;flex-direction:column;gap:14px;}
  .review-item{border-bottom:1px solid var(--line);padding-bottom:12px;}
  .review-item:last-child{border-bottom:none;}
  .review-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .review-item-head b{font-size:13px;font-weight:700;}
  .review-item-head .review-stars-sm{color:var(--lime-deep);font-size:12px;}
  .review-item p{margin:0;font-size:13px;color:var(--ink);line-height:1.45;}
  .review-form{border-top:2px solid var(--line);padding:16px 22px;background:var(--paper);}
  .review-form-title{font-size:12.5px;font-weight:700;margin:0 0 8px;}
  .star-select{display:flex;gap:4px;margin-bottom:10px;font-size:22px;}
  .star-select span{cursor:pointer;color:var(--line);}
  .star-select span.filled{color:var(--lime-deep);}
  .review-form textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;font-family:var(--sans);resize:none;outline:none;min-height:56px;}
  .review-form textarea:focus{border-color:var(--indigo);}
  .review-form input{width:100%;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-family:var(--sans);outline:none;margin-bottom:8px;}
  .review-form input:focus{border-color:var(--indigo);}
  .review-form button{margin-top:10px;width:100%;background:var(--indigo);color:#fff;border:none;padding:11px;border-radius:999px;font-weight:700;font-size:13px;}

  /* ===== Payment modal ===== */
  .payment-modal{max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border-radius:var(--r-lg);max-width:400px;width:100%;padding:28px 26px;border:2px solid var(--ink);}
  .pay-options{display:flex;gap:10px;margin:18px 0;}
  .pay-option{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 10px;font-size:12.5px;font-weight:700;color:var(--ink);}
  .pay-option .pay-icon{font-size:22px;}
  .pay-option.active{border-color:var(--indigo);background:#EDEBFF;}
  .pay-card-fields{display:flex;flex-direction:column;gap:10px;}
  .pay-card-fields input{border:2px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;font-family:var(--sans);outline:none;}
  .pay-card-fields input:focus{border-color:var(--indigo);}
  .pay-card-row{display:flex;gap:10px;}
  .pay-card-row input{flex:1;}
  .pay-cash-note{font-size:13px;color:var(--muted);background:var(--paper);border-radius:14px;padding:12px 14px;margin:0;}

  /* ===== Product detail modal ===== */
  .card{cursor:pointer;}
  .detail-modal{background:var(--panel);border-radius:var(--r-lg);max-width:420px;width:100%;padding:0;border:2px solid var(--ink);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
  .detail-thumb{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:80px;flex-shrink:0;}
  .detail-body{padding:22px 24px 24px;overflow-y:auto;}
  .detail-cat-tag{font-size:11.5px;color:var(--indigo);font-weight:700;margin-bottom:6px;}
  .detail-body h2{font-family:var(--display);font-size:21px;font-weight:700;margin:0 0 8px;line-height:1.25;}
  .detail-stars-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;}
  .detail-stars-row .stars-big{color:var(--lime-deep);font-size:15px;}
  .detail-stars-row span.count{font-size:12.5px;color:var(--muted);text-decoration:underline;}
  .detail-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;}
  .detail-price-row .price{font-family:var(--display);font-size:26px;font-weight:700;}
  .detail-desc{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0 0 20px;}
  .detail-add-btn{width:100%;background:var(--ink);border:2px solid var(--ink);padding:13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--paper);}
  .detail-add-btn:hover{background:var(--indigo);border-color:var(--indigo);}
  .detail-add-btn.added{background:var(--good);border-color:var(--good);color:#fff;}
  .detail-close{position:absolute;top:14px;right:14px;background:var(--panel);border:2px solid var(--ink);width:30px;height:30px;border-radius:50%;font-size:14px;z-index:2;}

  @media(max-width:900px){
    .header-row{display:flex;flex-wrap:wrap;}
    .header-spacer{display:none;}
    .header-actions{order:2;margin-left:auto;}
    .search-wrap{order:3;max-width:100%;width:100%;justify-self:auto;}
    .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;}
    .bento .b-hero{grid-column:span 2;grid-row:auto;flex-direction:column;align-items:flex-start;gap:16px;padding:22px;}
    .bento .b-side,.bento .b-stat{grid-column:span 1;grid-row:auto;min-height:110px;}
  }
  @media(max-width:480px){
    .pill-search{padding:3px 3px 3px 12px;}
    .pill-search select{max-width:64px;font-size:11.5px;padding-right:6px;}
    .pill-search input{padding:9px 8px;font-size:13px;}
    .search-actions-row{gap:6px;}
    #search-btn{padding:9px 18px;font-size:12px;}
    #cart-btn{padding:9px 12px 9px 12px;font-size:12px;}
  }

  /* ===== Intro splash animation ===== */
  #intro-splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s ease, visibility .5s ease;}
  #intro-splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:44px;font-weight:700;color:var(--on-bg);}
  .intro-dot{width:16px;height:16px;border-radius:50%;background:var(--lime);animation:intro-pulse 1s ease-in-out infinite;}
  .intro-letters span{display:inline-block;opacity:0;transform:translateY(18px);animation:intro-letter-in .5s ease forwards;}
  .intro-tagline{margin-top:14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-bg-soft);opacity:0;animation:intro-fade-in .6s ease forwards;animation-delay:1.1s;}
  @keyframes intro-letter-in{to{opacity:1;transform:translateY(0);}}
  @keyframes intro-fade-in{to{opacity:1;}}
  @keyframes intro-pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:.7;}}
</style>

/* ===== Registered users: saved in the browser (localStorage) ===== */
const memStore = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return (k in memStore) ? memStore[k] : null; },
  set(k,v){ memStore[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  remove(k){ delete memStore[k]; try{ localStorage.removeItem(k); }catch(e){} }
};

const SESSION_KEY = 'eshop_session';

const CUSTOM_PRODUCTS_KEY = 'eshop_custom_products';

try { customProducts = JSON.parse(store.get(CUSTOM_PRODUCTS_KEY)) || []; } catch(e){ customProducts = []; }
let nextCustomId = customProducts.length ? Math.max(...customProducts.map(p=>p.id)) + 1 : 1000;
function saveCustomProducts(){ store.set(CUSTOM_PRODUCTS_KEY, JSON.stringify(customProducts)); }
function allProducts(){ return PRODUCTS.concat(customProducts); }

const CUSTOM_CATEGORIES_KEY = 'eshop_custom_categories';
let customCategories = [];
try { customCategories = JSON.parse(store.get(CUSTOM_CATEGORIES_KEY)) || []; } catch(e){ customCategories = []; }
function saveCustomCategories(){ store.set(CUSTOM_CATEGORIES_KEY, JSON.stringify(customCategories)); }
function allCategoryLabels(){ return t().cats.concat(customCategories); }
function getProductName(id){
  const p = allProducts().find(pp=>pp.id===id);
  if(p && p.name) return p.name;
  return t().productNames[id] || '';
}

function renderCats(){
  const dropdown = document.getElementById('cats-dropdown');
  const sel = document.getElementById('cat-select');
  const catsFull = allCategoryLabels();
  const optionsHtml = catsFull.map((c,i) => `<option value="${i}">${c}</option>`).join('');
  dropdown.innerHTML = optionsHtml;
  dropdown.value = activeCatIndex;
  sel.innerHTML = optionsHtml;
  sel.value = activeCatIndex;
  dropdown.onchange = e=>{ activeCatIndex = Number(e.target.value); renderCats(); renderGrid(); };
  sel.onchange = e=>{ activeCatIndex = Number(e.target.value); renderCats(); renderGrid(); };
}

function starString(r){
  const full = Math.round(r);
  return "★".repeat(full) + "☆".repeat(5-full);
}

function renderGrid(){
  const d = t();
  const grid = document.getElementById('product-grid');
  const catsFull = allCategoryLabels();
  const filtered = allProducts().filter(p=>{
    const catOk = activeCatIndex===0 || p.catIndex===activeCatIndex-1;
    const term = searchTerm.trim().toLowerCase();
    const name = getProductName(p.id).toLowerCase();
    const catName = catsFull[p.catIndex+1].toLowerCase();
    const searchOk = !term || name.includes(term) || catName.includes(term);
    return catOk && searchOk;
  });
  document.getElementById('grid-title').textContent = activeCatIndex===0 ? d.todaysPicks : catsFull[activeCatIndex];
  document.getElementById('result-count').textContent = filtered.length + " " + d.resultsSuffix;
  grid.innerHTML = filtered.map(p=>`
    <div class="card" data-detail-id="${p.id}">
      <div class="thumb" style="background:${p.bg}"><span class="icon-anim" style="animation-delay:${(p.id%5)*0.15}s">${p.icon}</span></div>
      <div class="cat-tag">${catsFull[p.catIndex+1]}</div>
      <h3>${getProductName(p.id)}</h3>
      <div class="stars" data-review-id="${p.id}">${starString(p.rating)} <small>(${p.reviews})</small></div>
      <div class="price-row">
        <span class="price">${money(p.price)}</span>
        ${p.strike?`<span class="price-strike">${money(p.strike)}</span>`:''}
      </div>
      <button class="add-btn" data-id="${p.id}">${d.addToCart}</button>
    </div>
  `).join('') || `<p style="color:var(--on-bg)">${d.noResults}</p>`;

  grid.querySelectorAll('.card[data-detail-id]').forEach(card=>{
    card.addEventListener('click', ()=>{
      openDetail(Number(card.dataset.detailId));
    });
  });
  grid.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      cart[id] = (cart[id]||0) + 1;
      const original = d.addToCart;
      btn.textContent = d.added;
      btn.classList.add('added');
      setTimeout(()=>{ btn.textContent=original; btn.classList.remove('added'); }, 1200);
      updateCartUI();
    });
  });
  grid.querySelectorAll('.stars[data-review-id]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      openReviews(Number(el.dataset.reviewId));
    });
  });
}

function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const p = allProducts().find(pp=>pp.id===Number(id));
    return sum + (p ? p.price*qty : 0);
  },0);
}

function updateCartUI(){
  const d = t();
  document.getElementById('cart-count').textContent = cartCount();
  const itemsEl = document.getElementById('drawer-items');
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  if(entries.length===0){
    itemsEl.innerHTML = `<div class="empty-cart">${d.emptyCart}</div>`;
  } else {
    itemsEl.innerHTML = entries.map(([id,qty])=>{
      const p = allProducts().find(pp=>pp.id===Number(id));
      return `
        <div class="drawer-item">
          <div class="thumb-sm" style="background:${p.bg}"><span class="icon-anim">${p.icon}</span></div>
          <div class="info">
            <h4>${getProductName(p.id)}</h4>
            <div class="qty-row">
              <button data-id="${p.id}" data-action="dec">−</button>
              <span>${qty}</span>
              <button data-id="${p.id}" data-action="inc">+</button>
              <span style="margin-left:8px;font-weight:700;">${money(p.price*qty)}</span>
            </div>
            <div class="remove" data-id="${p.id}" data-action="remove">${d.remove}</div>
          </div>
        </div>`;
    }).join('');
    itemsEl.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = Number(el.dataset.id);
        const action = el.dataset.action;
        if(action==="inc") cart[id]++;
        if(action==="dec") { cart[id]--; if(cart[id]<=0) delete cart[id]; }
        if(action==="remove") delete cart[id];
        updateCartUI();
      });
    });
  }
  document.getElementById('subtotal').textContent = money(cartTotal());
  document.getElementById('checkout-btn').disabled = cartCount()===0;
}

async function hashPassword(pw){
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return btoa(unescape(encodeURIComponent(pw))); // fallback for very old browsers
}

function looksLikeEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function doSignIn(){
  const emailEl = document.getElementById('signin-email');
  const pwEl = document.getElementById('signin-password');
  const email = emailEl.value.trim().toLowerCase();
  const pw = pwEl.value;
  if(!looksLikeEmail(email) || !pw){ showErr('signin-error', t().authErrFill); return; }
  const hash = await hashPassword(pw);
  const user = loadUsers().find(u=>u.email===email && u.passHash===hash);
  if(!user){ pwEl.style.borderColor = '#C93A2E'; showErr('signin-error', t().authErrLogin); return; }
  pwEl.style.borderColor = '';
  document.getElementById('signin-error').style.display = 'none';
  store.set(SESSION_KEY, user.email);
  refreshAccountLabel();
  showAuthSuccess('signin');
}

async function doSignUp(){
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim().toLowerCase();
  const pw = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  const emailEl = document.getElementById('signup-email');
  const confirmEl = document.getElementById('signup-confirm');
  if(!name || !looksLikeEmail(email) || !pw){ showErr('signup-error', t().authErrFill); return; }
  if(pw !== confirm){ confirmEl.style.borderColor = '#C93A2E'; showErr('signup-error', t().authErrMismatch); return; }
  confirmEl.style.borderColor = '';
  const users = loadUsers();
  if(users.some(u=>u.email===email)){ emailEl.style.borderColor = '#C93A2E'; showErr('signup-error', t().authErrExists); return; }
  emailEl.style.borderColor = '';
  document.getElementById('signup-error').style.display = 'none';
  users.push({ name, email, passHash: await hashPassword(pw), createdAt: new Date().toISOString() });
  saveUsers(users);
  store.set(SESSION_KEY, email);
  refreshAccountLabel();
  showAuthSuccess('signup');
}

const REVIEWER_NAMES = ["Amina","Marko","Sara","Tarik","Lejla","Dino","Ivana","Ensar"];
const extraReviews = {}; // productId -> array of {name, stars, comment}
let currentReviewProductId = null;
let selectedStars = 5;

function baseReviewsFor(id){
  const d = t();
  const pool = d.reviewPool;
  const idxs = [id % pool.length, (id+2) % pool.length, (id+4) % pool.length];
  const names = [REVIEWER_NAMES[id % REVIEWER_NAMES.length], REVIEWER_NAMES[(id+3) % REVIEWER_NAMES.length], REVIEWER_NAMES[(id+5) % REVIEWER_NAMES.length]];
  return idxs.map((pi,i)=>({name:names[i], stars:pool[pi].stars, comment:pool[pi].text}));
}

function allReviewsFor(id){
  return [...(extraReviews[id]||[]), ...baseReviewsFor(id)];
}

function renderStarSelect(){
  document.querySelectorAll('#star-select span').forEach(s=>{
    s.classList.toggle('filled', Number(s.dataset.val) <= selectedStars);

}

function openReviews(productId){

  document.getElementById('review-product-name').textContent = getProductName(productId);
  document.getElementById('review-avg-stars').textContent = starString(avg);
  document.getElementById('review-count-text').textContent = avg.toFixed(1) + " · " + reviews.length + " " + (reviews.length===1 ? d.reviewsWord : d.reviewsWordFew);
  document.getElementById('review-list').innerHTML = reviews.map(r=>`
    <div class="review-item">

  document.getElementById('review-form-title').textContent = d.reviewFormTitle;
  document.getElementById('review-name-input').placeholder = d.reviewNamePh;
  document.getElementById('review-comment-input').placeholder = d.reviewCommentPh;
  document.getElementById('review-submit').textContent = d.reviewSubmit;
  selectedStars = 5;
  renderStarSelect();
  document.getElementById('review-overlay').classList.add('open');
}

const chatFab = document.getElementById('chat-fab');

let chatOpened = false;

function addBubble(text, who){
  const b = document.createElement('div');
  b.className = 'chat-bubble ' + who;
  b.textContent = text;
  chatMessages.appendChild(b);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function renderQuickReplies(){
  const d = t();
  chatQuick.innerHTML = d.chatQuick.map((q,i)=>`<button data-idx="${i}">${q}</button>`).join('');
  chatQuick.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.idx);
      sendUserMessage(d.chatQuick[idx], idx);
    });
  });
}

function botReplyFor(idx, rawText){
  const d = t();
  if(idx===0) return d.chatReplyDelivery;
  if(idx===1) return d.chatReplyReturns;
  if(idx===2) return d.chatReplyPayment;
  if(idx===3) return d.chatReplyHuman;
  const text = (rawText||"").toLowerCase();
  if(/dostav|delivery|lieferung|order|narudžb|bestellung/.test(text)) return d.chatReplyDelivery;
  if(/vrat|return|rückgabe|refund/.test(text)) return d.chatReplyReturns;
  if(/plać|payment|zahlung|card|kartic/.test(text)) return d.chatReplyPayment;
  if(/čovj|human|mitarbeiter|osob/.test(text)) return d.chatReplyHuman;
  return d.chatReplyDefault;
}

function sendUserMessage(text, quickIdx){
  if(!text || !text.trim()) return;
  addBubble(text, 'user');
  chatInput.value = '';
  const typing = document.createElement('div');
  typing.className = 'chat-typing';
  typing.id = 'chat-typing-indicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chatMessages.appendChild(typing);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  setTimeout(()=>{
    const el = document.getElementById('chat-typing-indicator');
    if(el) el.remove();
    addBubble(botReplyFor(quickIdx, text), 'bot');
  }, 700 + Math.random()*400);
}

  chatPanel.classList.add('open');
  if(!chatOpened){
    chatOpened = true;
    addBubble(t().chatWelcome, 'bot');
    renderQuickReplies();
  }
}
